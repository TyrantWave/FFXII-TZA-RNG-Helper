name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

# NOTE: For stronger supply chain security, pin each `uses:` action to a
# specific commit SHA (e.g. actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68)
# rather than a mutable tag. The tags used here match the rest of the project's
# existing style; revisit when doing a security hardening pass on the CI.

jobs:
  rust:
    name: Rust — fmt / clippy / test / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test --locked -p ffxii_tza_rng

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  frontend:
    name: Frontend — build WASM / audit / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web --out-dir pkg
        working-directory: ffxii_tza_rng_wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: lint
        run: npm run lint
        working-directory: frontend

      - name: test
        run: npm test -- --no-watch
        working-directory: frontend

      - name: build
        run: npm run build
        working-directory: frontend

  scripts-audit:
    name: Scripts — security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: uv audit
        run: uv audit
        working-directory: scripts
