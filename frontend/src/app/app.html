<div class="layout">
  <aside class="controls-column">
    <tza-character-panel
      [character]="character()"
      (characterChange)="onCharacterChange($event)"
    />
    <mat-divider />
    <tza-controls-panel
      [searchStatus]="wasm.searchStatus()"
      [elapsedSeconds]="wasm.elapsedSeconds()"
      [position]="highlightRange()?.end ?? 0"
      [(browseSeed)]="browseSeed"
      [initialValues]="initialHeals"
      (findSeed)="onFindSeed($event)"
      (findPosition)="onFindPosition($event)"
    />
  </aside>
  <main class="table-column">
    <tza-values-table
      [values]="wasm.values()"
      [highlightRange]="highlightRange()"
      [pivotPosition]="pivotPosition()"
      (rowClick)="onRowClick($event)"
    />
  </main>
</div>
