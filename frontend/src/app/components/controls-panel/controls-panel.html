<div class="controls-panel">
  <mat-form-field appearance="outline">
    <mat-label>Seed</mat-label>
    <input
      matInput
      type="number"
      [value]="browseSeed()"
      (input)="browseSeed.set(+$any($event.target).value)"
      data-testid="seed-input"
    />
  </mat-form-field>

  <div class="observed-values">
    @for (i of indices; track i) {
      <mat-form-field appearance="outline">
        <mat-label>Heal {{ i + 1 }}</mat-label>
        <input
          matInput
          type="number"
          [value]="observedValues()[i] ?? ''"
          (input)="setValue(i, $any($event.target).value)"
          [attr.data-testid]="'heal-' + i"
        />
      </mat-form-field>
    }
  </div>

  <div class="action-row">
    <button mat-flat-button (click)="onFindSeed()" data-testid="find-seed-btn">Find Seed</button>
    <button mat-flat-button (click)="onFindPosition()" data-testid="find-position-btn">Find Position</button>
    @if (searchStatus() !== 'idle') {
      <span class="status-label" data-testid="search-status">{{ statusLabel[searchStatus()] }}</span>
    }
  </div>
</div>
