<tza-panel title="Character">
  <div class="stat-rows">
    <div class="stat-row">
      <span class="stat-label">Level</span>
      <input
        class="stat-input"
        type="number"
        min="1"
        max="99"
        [value]="level()"
        (input)="onLevelInput($event)"
        data-testid="level-input"
      />
    </div>

    <div class="stat-row">
      <span class="stat-label">Magic</span>
      <input
        class="stat-input"
        type="number"
        min="1"
        max="99"
        [value]="magic()"
        (input)="onMagicInput($event)"
        data-testid="magic-input"
      />
    </div>

    <div class="stat-row">
      <span class="stat-label">Spell</span>
      <select
        class="stat-select"
        [value]="spell()"
        (change)="onSpellSelectChange($event)"
        data-testid="spell-select"
      >
        @for (s of spells; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>

    <div class="stat-row">
      <span class="stat-label">Serenity</span>
      <button
        class="dot-toggle"
        [class.active]="serenity()"
        (click)="onSerenityChange(!serenity())"
        type="button"
        [attr.aria-pressed]="serenity()"
        aria-label="Serenity"
        data-testid="serenity-toggle"
      >
        <span class="dot"></span>
      </button>
    </div>
  </div>
</tza-panel>
